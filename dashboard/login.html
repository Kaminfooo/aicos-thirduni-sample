<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICOS Secure Login</title><style>
body{margin:0;background:#071014;color:#e8f3f4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 36px));background:#0d1b20;border:1px solid #294750;border-radius:14px;padding:28px;box-shadow:0 18px 60px #0008}h1{margin:0 0 6px;font-size:24px}.sub{color:#8eabb2;margin-bottom:22px}.row{display:grid;gap:8px;margin:12px 0}label{font-size:12px;color:#a9bdc2}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #34545c;background:#10252b;color:#eef8f8;font-size:15px}button{background:#126a67;border-color:#238a85;font-weight:700;cursor:pointer}.err{color:#ff9696;min-height:20px;margin-top:10px}.ok{color:#6be7ac}.links{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.links a{color:#78d5d0;text-decoration:none;font-size:13px}</style><link rel="stylesheet" href="/dashboard/aicos-light.css"></head><body class="login-page">
<div class="box"><h1>AICOS Operator Workspace</h1><div class="sub">Local sovereign operator authentication. Credentials remain inside this deployment.</div>
<div class="row"><label>Backend URL (leave blank when served by AICOS)</label><input id="base" placeholder="https://aicos.internal"></div>
<div class="row"><label>Username</label><input id="user" autocomplete="username"></div>
<div class="row"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
<button id="login">SIGN IN</button><div id="msg" class="err"></div>
<div class="links"><a href="/dashboard/live-ops.html">Live Operations</a><a href="/dashboard/fleet.html">Camera Fleet</a><a href="/dashboard/forensics.html">Forensics</a><a href="/dashboard/triage.html">Triage Assistant</a></div></div>
<script src="/dashboard/aicos-auth.js"></script><script>
const $=id=>document.getElementById(id); $('login').onclick=async()=>{ $('msg').textContent='Signing in…'; try{const u=await AicosAuth.login($('base').value,$('user').value,$('pass').value); $('msg').className='ok'; $('msg').textContent='Signed in as '+u.username+' ('+u.role+').'; setTimeout(()=>location.href='/dashboard/live-ops.html',400)}catch(e){$('msg').className='err';$('msg').textContent=e.message}}; $('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
</script></body></html>
